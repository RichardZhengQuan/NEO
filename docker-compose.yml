name: neo

# ── Core service ──────────────────────────────────────────────────────────────
services:
  neo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/your-org/neo:latest   # replace with your registry or use build:
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
      # For intentional LAN access without a reverse proxy, replace the line above:
      # - "7777:7777"
    volumes:
      - neo_data:/data
    environment:
      NEO_MODE: server
      NEO_HOST: "0.0.0.0"
      NEO_PORT: "7777"
      NEO_DATA_DIR: /data
      NEO_WEB_DIR: /app/apps/web/dist
      # Public URL used in pairing links and Web Push click targets.
      # Set this to your public domain when running behind a reverse proxy.
      # NEO_PUBLIC_URL: "https://neo.example.com"

      # ── Provider API keys (inject via .env or Docker secrets) ──
      # ANTHROPIC_API_KEY: ""
      # OPENAI_API_KEY: ""
      # GEMINI_API_KEY: ""
      # OLLAMA_BASE_URL: "http://ollama:11434"

      # Optional: skip onboarding, fix the owner token, set log level.
      # NEO_TOKEN: ""
      # NEO_LOG_LEVEL: "info"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://localhost:7777/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ── Ollama (local AI) ─────────────────────────────────────────────────────────
# Start with: docker compose --profile local-ai up
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [local-ai]
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_ORIGINS: "*"
    ports:
      - "11434:11434"
    # GPU access (uncomment for NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

# ── Caddy (automatic HTTPS) ───────────────────────────────────────────────────
# Start with: docker compose --profile tls up
# Edit deploy/Caddyfile to set your domain before starting.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [tls]
    depends_on:
      neo:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  neo_data:
  ollama_models:
  caddy_data:
  caddy_config:
